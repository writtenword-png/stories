<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nouvelles</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1612;
    --ink-muted: #6b6259;
    --ink-faint: #c8bfb5;
    --paper: #f7f3ee;
    --paper-warm: #ede8e1;
    --paper-card: #faf7f4;
    --accent: #8b3a2a;
    --accent-light: #c4694f;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Instrument Sans', system-ui, sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    min-height: 100vh;
  }

  /* ── Layout ── */
  .site-wrapper {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 2rem;
  }

  /* ── Header ── */
  header {
    padding: 4rem 0 3rem;
    border-bottom: 1px solid var(--ink-faint);
    margin-bottom: 3rem;
  }

  .header-inner {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .site-eyebrow {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }

  .site-title {
    font-size: clamp(2.8rem, 7vw, 5rem);
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .site-title em {
    font-style: italic;
    color: var(--accent);
  }

  .site-subtitle {
    font-size: 1.1rem;
    font-weight: 300;
    color: var(--ink-muted);
    font-style: italic;
    margin-top: 0.75rem;
  }

  /* ── Story list ── */
  #list-view { display: block; }
  #reader-view { display: none; }

  .stories-label {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .stories-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--ink-faint);
  }

  .story-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .story-item {
    display: flex;
    align-items: baseline;
    gap: 1.5rem;
    padding: 1.25rem 0;
    border-bottom: 1px solid var(--paper-warm);
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: padding-left 0.25s ease;
    position: relative;
  }

  .story-item::before {
    content: '';
    position: absolute;
    left: -2rem;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 0;
    background: var(--accent);
    transition: height 0.2s ease;
    border-radius: 2px;
  }

  .story-item:hover { padding-left: 0.75rem; }

  .story-item:hover::before { height: 60%; }

  .story-num {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--ink-faint);
    min-width: 2rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  .story-info { flex: 1; }

  .story-name {
    font-size: 1.35rem;
    font-weight: 400;
    line-height: 1.2;
    color: var(--ink);
    transition: color 0.2s;
  }

  .story-item:hover .story-name { color: var(--accent); }

  .story-date {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-muted);
    margin-top: 3px;
  }

  .story-arrow {
    font-size: 1.1rem;
    color: var(--ink-faint);
    transition: color 0.2s, transform 0.2s;
    flex-shrink: 0;
  }

  .story-item:hover .story-arrow {
    color: var(--accent);
    transform: translateX(4px);
  }

  .empty-state {
    text-align: center;
    padding: 4rem 0;
    color: var(--ink-muted);
    font-style: italic;
    font-size: 1.1rem;
  }

  /* ── Reader ── */
  #reader-view {
    padding-bottom: 6rem;
  }

  .reader-back {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    margin: 2rem 0 3rem;
    transition: color 0.2s;
  }

  .reader-back:hover { color: var(--accent); }

  .reader-back svg { width: 14px; height: 14px; }

  .reader-title {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 300;
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin-bottom: 0.75rem;
    color: var(--ink);
  }

  .reader-date {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: 0.05em;
    margin-bottom: 3rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--ink-faint);
  }

  .reader-body {
    font-size: 1.2rem;
    line-height: 1.9;
    font-weight: 300;
    color: var(--ink);
    max-width: 620px;
    white-space: pre-wrap;
  }

  .reader-body p { margin-bottom: 1.5em; }

  /* ── Footer ── */
  footer {
    margin-top: 5rem;
    padding: 2rem 0;
    border-top: 1px solid var(--ink-faint);
    text-align: center;
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .story-item {
    animation: fadeUp 0.4s ease both;
  }

  .story-item:nth-child(1) { animation-delay: 0.05s; }
  .story-item:nth-child(2) { animation-delay: 0.1s; }
  .story-item:nth-child(3) { animation-delay: 0.15s; }
  .story-item:nth-child(4) { animation-delay: 0.2s; }
  .story-item:nth-child(5) { animation-delay: 0.25s; }

  #reader-view.visible {
    animation: fadeUp 0.4s ease both;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .site-wrapper { padding: 0 1.25rem; }
    header { padding: 2.5rem 0 2rem; }
    .story-item::before { left: -1.25rem; }
  }
</style>
</head>
<body>

<div class="site-wrapper">
  <header>
    <div class="header-inner">
      <span class="site-eyebrow">Nouvelles · Fiction courte</span>
      <h1 class="site-title">Mes <em>Histoires</em></h1>
      <p class="site-subtitle">Un recueil de nouvelles en libre accès</p>
    </div>
  </header>

  <!-- LIST VIEW -->
  <div id="list-view">
    <div class="stories-label" id="stories-label">Chargement…</div>
    <div class="story-list" id="story-list"></div>
  </div>

  <!-- READER VIEW -->
  <div id="reader-view">
    <button class="reader-back" onclick="closeReader()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M10 3L5 8l5 5"/>
      </svg>
      Retour
    </button>
    <h2 class="reader-title" id="reader-title"></h2>
    <div class="reader-date" id="reader-date"></div>
    <div class="reader-body" id="reader-body"></div>
  </div>

  <footer>
    Toutes les nouvelles sont partagées librement — open source
  </footer>
</div>

<script>
  let stories = [];

  function formatDate(str) {
    if (!str) return '';
    const d = new Date(str + 'T00:00:00');
    return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function renderList() {
    const label = document.getElementById('stories-label');
    const list = document.getElementById('story-list');
    label.textContent = stories.length + ' nouvelle' + (stories.length !== 1 ? 's' : '');
    if (stories.length === 0) {
      list.innerHTML = '<p class="empty-state">Aucune nouvelle pour l\'instant, revenez bientôt.</p>';
      return;
    }
    list.innerHTML = stories.map((s, i) => `
      <div class="story-item" onclick="openStory(${i})" role="button" tabindex="0" aria-label="Lire ${s.title}">
        <span class="story-num">${pad(i + 1)}</span>
        <div class="story-info">
          <div class="story-name">${escHtml(s.title)}</div>
          ${s.date ? `<div class="story-date">${formatDate(s.date)}</div>` : ''}
        </div>
        <span class="story-arrow">→</span>
      </div>
    `).join('');

    list.querySelectorAll('.story-item').forEach((el, i) => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openStory(i); });
    });
  }

  function openStory(i) {
    const s = stories[i];
    document.getElementById('reader-title').textContent = s.title;
    document.getElementById('reader-date').textContent = s.date ? formatDate(s.date) : '';
    const body = document.getElementById('reader-body');
    body.innerHTML = s.body.split(/\n\n+/).map(p => `<p>${escHtml(p.trim())}</p>`).join('');
    document.getElementById('list-view').style.display = 'none';
    const rv = document.getElementById('reader-view');
    rv.style.display = 'block';
    rv.classList.add('visible');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closeReader() {
    document.getElementById('reader-view').style.display = 'none';
    document.getElementById('reader-view').classList.remove('visible');
    document.getElementById('list-view').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  fetch('stories.json?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(data => { stories = data; renderList(); })
    .catch(() => {
      document.getElementById('stories-label').textContent = 'Erreur de chargement';
      document.getElementById('story-list').innerHTML =
        '<p class="empty-state">Impossible de charger les nouvelles. Vérifiez que stories.json est au bon endroit.</p>';
    });
</script>
</body>
</html>
